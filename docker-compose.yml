version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: ksp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ksp_user
      POSTGRES_PASSWORD: ksp_password
      POSTGRES_DB: ksp_crime_db
    volumes:
      - ksp_db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksp_user -d ksp_crime_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ksp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: ksp_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ksp_minio_admin
      MINIO_ROOT_PASSWORD: ksp_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ksp_minio_data:/data

  backend:
    build:
      context: ./backend
    container_name: ksp_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://ksp_user:ksp_password@db:5432/ksp_crime_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "python scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  celery_worker:
    build:
      context: ./backend
    container_name: ksp_celery_worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://ksp_user:ksp_password@db:5432/ksp_crime_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - redis
    command: celery -A app.services.celery_app worker --loglevel=info

  frontend:
    build:
      context: ./frontend
    container_name: ksp_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  nginx:
    image: nginx:1.27-alpine
    container_name: ksp_nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"

volumes:
  ksp_db_data:
  ksp_minio_data:
